name: Daily Error Monitoring

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  error-monitoring:
    runs-on: ubuntu-latest
    name: Monitor Search Console Errors

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run error monitoring
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python error_monitoring.py

  success-notification:
    runs-on: ubuntu-latest
    needs: error-monitoring
    if: success()
    name: Success Notification

    steps:
      - name: Log success
        run: echo "✅ Daily error monitoring completed successfully"
