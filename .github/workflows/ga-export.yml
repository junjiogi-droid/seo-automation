name: GA4 Export (manual)

on:
  workflow_dispatch:  # Manual trigger only; the weekly run is part of Weekly Ranking Analysis

jobs:
  ga-export:
    runs-on: ubuntu-latest
    name: Export GA4 data

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run GA4 export
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python ga_weekly_export.py

      - name: Upload GA4 pages CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga-pages-csv
          path: data/ga_pages_*.csv
          retention-days: 90
          if-no-files-found: ignore
