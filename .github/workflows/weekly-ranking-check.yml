name: Weekly Ranking Analysis

on:
  schedule:
    # Run every Friday at 18:00 JST (09:00 UTC)
    - cron: '0 9 * * FRI'
  workflow_dispatch:  # Allow manual trigger

jobs:
  ranking-analysis:
    runs-on: ubuntu-latest
    name: Detect Low Ranking Keywords

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ranking detector
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python low_ranking_detector.py

      - name: Generate report
        if: success()
        run: |
          echo "✅ Ranking analysis completed"
          echo "Check Google Sheets (GID: 953824174) for results"

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Weekly ranking analysis failed. Check the workflow logs.'
            })

  cleanup:
    runs-on: ubuntu-latest
    needs: ranking-analysis
    if: success()
    name: Analysis Complete

    steps:
      - name: Log completion
        run: |
          echo "✅ Weekly ranking analysis completed successfully"
          echo "Timestamp: $(date)"
