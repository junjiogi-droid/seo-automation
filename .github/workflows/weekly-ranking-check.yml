name: Weekly Ranking Analysis

on:
  schedule:
    # Run every Friday at 18:00 JST (09:00 UTC)
    - cron: '0 9 * * FRI'
  workflow_dispatch:  # Allow manual trigger

jobs:
  ranking-analysis:
    runs-on: ubuntu-latest
    name: Detect Low Ranking Keywords

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ranking detector
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python low_ranking_detector.py

      - name: Run priority keyword export
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python priority_keywords_export.py

      - name: Upload priority keyword CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priority-keywords-csv
          path: data/priority_keywords_*.csv
          retention-days: 90
          if-no-files-found: ignore

      - name: Generate report
        if: success()
        run: |
          echo "✅ Ranking analysis completed"
          echo "Check Google Sheets (GID: 953824174) for keyword drops"
          echo "Check Google Sheets tab '優先KW週次' + the priority-keywords-csv artifact for the CTR tracking export"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Weekly ranking analysis failed. Check the workflow logs."

  cleanup:
    runs-on: ubuntu-latest
    needs: ranking-analysis
    if: success()
    name: Analysis Complete

    steps:
      - name: Log completion
        run: |
          echo "✅ Weekly ranking analysis completed successfully"
          echo "Timestamp: $(date)"
